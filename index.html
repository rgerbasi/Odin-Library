        <dialog id="form-dialog">
            <div class="dialog-content">
                <form action="">
                    <h1>Add a New Book</h1>
                
                    <label for="title" class="text-label">
                        Title
                        <input type="text" id="title" name="title" placeholder="Title" required>
                    </label>
                
                    <label for="author" class="text-label">
                        Author
                        <input type="text" id="author" name="author" placeholder="Author">
                    </label>
                
                    <label for="pages" class="text-label">
                        Pages
                        <input type="number"  id="pages" name="pages" placeholder="0" min="0">
                    </label>
                
                    <fieldset> 
                        <legend>Status</legend>
                        <div class="radio-wrapper">
                            <input id="not-read"
                                    name="read"
                                    type="radio"
                                    value="false"
                                    checked
                                    >
                            <label for="not-read" class="radio-label">Not Read </label>
                        </div>
                        <div class="radio-wrapper">
                            <input id="read"
                                    name="read"
                                    type="radio"
                                    value="true"
                                    >
                            <label for="read" class="radio-label">Have Read</label>
                        </div>
                    </fieldset>
                    

                    <div class="button-container">
                    <button type="button" id="close">Close</button>
                    <button  id="submit"></button>
                    </div>
                </form>
            </div>
        </dialog>

        <dialog id="confirm-dialog" >
            <div class="dialog-content">
                <h1>Are you sure you want to remove this book?</h1>
                <div class="button-container">
                    <button type="button" id="no">No</button>
                    <button type="button" id="yes">Yes</button>
                </div>
            </div>
        </dialog>
    </div>
