<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- svgs and symbols -->
    <svg style="display:none" aria-hidden="true">
        <symbol id="icon-pencil" viewBox="0 0 24 24">
           <path fill="currentColor" d="M19,3A2,2 0 0,1 21,5V19C21,20.11 20.1,21 19,21H5A2,2 0 0,1 3,19V5A2,2 0 0,1 5,3H19M16.7,9.35C16.92,9.14 16.92,8.79 16.7,8.58L15.42,7.3C15.21,7.08 14.86,7.08 14.65,7.3L13.65,8.3L15.7,10.35L16.7,9.35M7,14.94V17H9.06L15.12,10.94L13.06,8.88L7,14.94Z"></path>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z" ></path>
        </symbol>
    </svg>

    <div class="layout">
        <h1>My Library</h1>
        <button>New Book</button>
        <div class="library">
            <div class="bookspace">
                <div class="bookcard read">
                    <ul>
                    <li class="title">Title: Dungeon Crawler Carl</li>
                    <hr>
                    <li>Author: Matt Dinniman</li>
                    <li>Pages: 464</li>
                    <li>Has Read</li>
                    </ul>
                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>pencil-box</title><path d="M19,3A2,2 0 0,1 21,5V19C21,20.11 20.1,21 19,21H5A2,2 0 0,1 3,19V5A2,2 0 0,1 5,3H19M16.7,9.35C16.92,9.14 16.92,8.79 16.7,8.58L15.42,7.3C15.21,7.08 14.86,7.08 14.65,7.3L13.65,8.3L15.7,10.35L16.7,9.35M7,14.94V17H9.06L15.12,10.94L13.06,8.88L7,14.94Z" /></svg>
                    </button>
                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>close-circle</title><path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z" /></svg>
                    </button>
                </div>
            </div>
            <div class="bookspace">
                <div class="bookcard">
                    <ul>
                    <li class="title">Title: Dungeon Crawler Carl</li>
                    <hr>
                    <li>Author: Matt Dinniman</li>
                    <li>Pages: 464</li>
                    <li>Has Read</li>
                    </ul>
                    <button>
                        <svg>
                            <use href="#icon-pencil"></use>
                        </svg>
                    </button>
                    <button>
                        <svg>
                            <use href="#icon-close"></use>
                        </svg>
                    </button>
                </div>
            </div>
           
           
        </div>

       
    </div>
    <script src="scripts.js"></script>
</body>
</html>
